<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up | Event Link</title>
  <link rel="stylesheet" href="bootstrap/bootstrap.css"/>
  <link rel="stylesheet" href="fontawesome/css/all.min.css"/>
  <link rel="stylesheet" href="fontawesome/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
      url('img/event1.webp') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Header-style Back Button */
    .back {
      position: absolute;
      top: 40px;
      left: 40px;
    }

    .back a {
      text-decoration: none;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .back a:hover {
      color: #dcb6a3;
      transform: scale(1.05);
    }

    .signup-btn {
        position: absolute;
        top: 50px;
        right: 40px; 
    }

    .signup-btn a {
      text-decoration: none;
      color: #eeeeee;
      font-size: 25px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.3s ease;
    }

    .signup-btn a:hover {
      color: #dcb6a3; 
      transform: scale(1.05); 
    }

    /* Card Styling */
    .card {
      background-color: rgba(255, 255, 255, 0.95);
      border: none;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .card-title {
      font-family: "Dancing Script", cursive;
      font-size: 42px;
      color: #dcb6a3;
      margin-bottom: 5px;
    }

    .card-subtitle {
      font-size: 16px;
      color: #555;
      margin-bottom: 25px;
    }

    /* Input Fields */
    .input-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .form-control {
      width: 100%;
      padding: 14px 45px 14px 45px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background-color: rgba(255, 255, 255, 0.7);
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background-color: #fff;
      border-color: #dcb6a3;
      box-shadow: 0 0 5px #dcb6a3;
      outline: none;
    }

    .form-icon {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #888;
      font-size: 18px;
    }

    /* Button */
    .btn {
      background-color: #dcb6a3;
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #c49b88;
      transform: scale(1.02);
    }

    /* Footer Text */
    .text {
      font-size: 16px;
      margin-top: 15px;
      color: #333;
    }

    .text a {
      color: #dcb6a3;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .text a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 500px) {
      .card {
        width: 90%;
        padding: 30px 25px;
      }
    }
  </style>
</head>
<body>
  <!-- Back Button -->
  <div class="back">
    <a href="index.html">
      <i class="fa-solid fa-reply"></i> Back
    </a>
  </div>

  <div class="signup-btn">
    <a href="staff_signup.html">
      <i class="fa-solid fa-user-plus"></i> Staff
    </a>
  </div>

  <!-- Registration Card -->
  <div class="card shadow">
    <h2 class="card-title">EventLink</h2>
    <p class="card-subtitle">Create your account</p>

    <form id="regform" method="POST" action="php/customer_reg.php">
      <div class="input-wrapper">
        <i class="fa-solid fa-id-badge form-icon"></i>
        <input type="text" class="form-control" name="fname" id="fname" placeholder="First Name" required>
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-id-badge form-icon"></i>
        <input type="text" class="form-control" name="Mname" id="Mname" placeholder="Middle Name" required>
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-id-badge form-icon"></i>
        <input type="text" class="form-control" name="lname" id="lname" placeholder="Last Name" required>
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-envelope form-icon"></i>
        <input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-lock form-icon"></i>
        <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-lock form-icon"></i>
        <input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required>
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-phone form-icon"></i>
        <input type="text" class="form-control" name="num" id="num" placeholder="Phone Number">
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">Register</button>
    </form>

    <div class="text text-center">
      Already have an account? <a href="staff_login.html">Login</a>
    </div>
  </div>

  <script src="bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
