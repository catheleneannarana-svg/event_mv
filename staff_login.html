<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log In | Event Link</title>
  <link rel="stylesheet" href="bootstrap/bootstrap.css"/>
  <link rel="stylesheet" href="fontawesome/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
      url('img/event1.webp') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
    }

    /* Header-style buttons (Back & Sign Up) */
    .back, .signup-btn {
      position: absolute;
      top: 40px;
    }

    .back {
      left: 40px;
    }

    .back a {
      text-decoration: none;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .back a:hover {
      color: #dcb6a3;
      transform: scale(1.05);
    }

    .signup-btn {
        position: absolute;
        top: 50px;
        right: 40px; 
    }

    .signup-btn a {
      text-decoration: none;
      color: #eeeeee;
      font-size: 25px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.3s ease;
    }

    .signup-btn a:hover {
      color: #dcb6a3; 
      transform: scale(1.05); 
    }

    /* Login Card Styling */
    .card {
      background-color: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 20px;
      padding: 40px 35px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .card-title {
      font-family: "Dancing Script", cursive;
      font-size: 42px;
      color: #dcb6a3;
      margin-bottom: 10px;
    }

    .card-subtitle {
      font-size: 16px;
      color: #555;
      margin-bottom: 30px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 25px;
    }

    .form-control {
      width: 100%;
      padding: 15px 45px 15px 45px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background-color: rgba(255, 255, 255, 0.7);
      transition: 0.3s;
    }

    .form-control:focus {
      background-color: white;
      border-color: #dcb6a3;
      box-shadow: 0 0 5px #dcb6a3;
      outline: none;
    }

    .form-icon {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #888;
      font-size: 18px;
    }

    .btn {
      background-color: #dcb6a3;
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #c49b88;
    }

    /* Responsive */
    @media (max-width: 500px) {
      .card {
        width: 90%;
        padding: 30px 25px;
      }

      .back a, .signup-btn a {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation-like Buttons -->
  <div class="back">
    <a href="index.html">
      <i class="fa-solid fa-reply"></i> Back
    </a>
  </div>

  <div class="signup-btn">
    <a href="staff_signup.html">
      <i class="fa-solid fa-user-plus"></i> Sign Up
    </a>
  </div>

  <!-- Login Card -->
  <div class="card shadow">
    <h2 class="card-title">EventLink</h2>
    <p class="card-subtitle">Log in to continue</p>

    <form id="staffreg" method="POST" action="php/login.php">
      <div class="input-wrapper">
        <i class="fa-solid fa-envelope form-icon"></i>
        <input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-lock form-icon"></i>
        <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
      </div>

      <button type="submit" id="submit-btn" class="btn">Log In</button>
    </form>
  </div>

  <script src="bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
